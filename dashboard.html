<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Channel Cloner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f1a;--card:#1a1a2e;--card2:#16213e;--border:#2a2a4a;
  --accent:#7c3aed;--accent2:#a78bfa;--green:#22c55e;--red:#ef4444;
  --yellow:#eab308;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* Header */
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600}
.badge-on{background:rgba(34,197,94,.15);color:var(--green)}
.badge-off{background:rgba(239,68,68,.15);color:var(--red)}

/* Layout */
.container{max-width:1100px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:20px}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.card-title{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;font-weight:600}
.stat-value{font-size:28px;font-weight:700;margin-bottom:4px}
.stat-label{font-size:13px;color:var(--text2)}

/* Toggle Switch */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:none}
.toggle-label{font-size:14px}
.toggle{position:relative;width:44px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;inset:0;background:#333;border-radius:24px;transition:.3s}
.toggle .slider:before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.slider{background:var(--accent)}
.toggle input:checked+.slider:before{transform:translateX(20px)}

/* Buttons */
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#6d28d9}
.btn-danger{background:rgba(239,68,68,.15);color:var(--red)}
.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--card2)}

/* Input */
.input{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;width:100%;outline:none;transition:.2s}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--text3)}
textarea.input{resize:vertical;min-height:60px;font-family:inherit}

/* Routes Table */
.route-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;background:var(--bg);margin-bottom:8px;flex-wrap:wrap}
.route-info{flex:1;min-width:200px}
.route-channels{font-size:14px;font-weight:500;margin-bottom:2px;word-break:break-all}
.route-ids{font-size:11px;color:var(--text3)}
.route-actions{display:flex;gap:6px}
.route-active{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.active-on{background:rgba(34,197,94,.15);color:var(--green)}
.active-off{background:rgba(234,179,8,.15);color:var(--yellow)}

/* Add Route Form */
.add-form{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.add-form .input{flex:1;min-width:150px}

/* Section */
.section{margin-bottom:20px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:16px;font-weight:600}

/* Empty State */
.empty{text-align:center;padding:30px;color:var(--text3);font-size:14px}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;color:#fff;z-index:999;transform:translateY(100px);opacity:0;transition:.3s}
.toast.show{transform:translateY(0);opacity:1}
.toast-ok{background:var(--green)}
.toast-err{background:var(--red)}

/* Mobile */
@media(max-width:600px){
  .container{padding:12px}
  .grid{grid-template-columns:1fr 1fr}
  .stat-value{font-size:22px}
  .add-form{flex-direction:column}
  .route-item{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<div class="header">
  <h1>Channel Cloner</h1>
  <span id="statusBadge" class="badge badge-on">RUNNING</span>
</div>

<div class="container">
  <!-- Stats -->
  <div class="grid" id="statsGrid">
    <div class="card">
      <div class="card-title">Cloned</div>
      <div class="stat-value" id="statCloned">0</div>
      <div class="stat-label">messages</div>
    </div>
    <div class="card">
      <div class="card-title">Failed</div>
      <div class="stat-value" id="statFailed" style="color:var(--red)">0</div>
      <div class="stat-label">messages</div>
    </div>
    <div class="card">
      <div class="card-title">Uptime</div>
      <div class="stat-value" id="statUptime">0h 0m</div>
      <div class="stat-label">since start</div>
    </div>
    <div class="card">
      <div class="card-title">Active Routes</div>
      <div class="stat-value" id="statRoutes">0</div>
      <div class="stat-label">channels</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="grid">
    <div class="card section">
      <div class="section-title" style="margin-bottom:12px">Bot Controls</div>
      <div class="toggle-row">
        <span class="toggle-label">Pause Bot</span>
        <label class="toggle"><input type="checkbox" id="togglePause" onchange="setConfig('is_paused',this.checked)"><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Remove Links</span>
        <label class="toggle"><input type="checkbox" id="toggleLinks" onchange="setConfig('remove_links',this.checked)"><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Remove @mentions</span>
        <label class="toggle"><input type="checkbox" id="toggleMentions" onchange="setConfig('remove_usernames',this.checked)"><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Remove #hashtags</span>
        <label class="toggle"><input type="checkbox" id="toggleTags" onchange="setConfig('remove_hashtags',this.checked)"><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Skip Forwarded</span>
        <label class="toggle"><input type="checkbox" id="toggleFwd" onchange="setConfig('skip_forwarded',this.checked)"><span class="slider"></span></label>
      </div>
    </div>

    <div class="card section">
      <div class="section-title" style="margin-bottom:12px">Settings</div>
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--text3);display:block;margin-bottom:4px">HEADER TEXT</label>
        <input class="input" id="headerText" placeholder="Text to prepend..." oninput="setConfig('header_text',this.value)">
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--text3);display:block;margin-bottom:4px">FOOTER TEXT</label>
        <input class="input" id="footerText" placeholder="Text to append..." oninput="setConfig('footer_text',this.value)">
      </div>
      <div>
        <label style="font-size:12px;color:var(--text3);display:block;margin-bottom:4px">CLONE DELAY (seconds)</label>
        <input class="input" id="cloneDelay" type="number" min="0" max="30" oninput="setConfig('clone_delay',this.value)">
      </div>
    </div>
  </div>

  <!-- Routes -->
  <div class="card section">
    <div class="section-header">
      <span class="section-title">Routes</span>
    </div>
    <div class="add-form">
      <input class="input" id="routeSource" placeholder="Source: @channel or ID">
      <input class="input" id="routeDest" placeholder="Dest: @channel or ID">
      <button class="btn btn-primary" onclick="addRoute()">+ Add Route</button>
    </div>
    <div id="routesList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let debounceTimer = {};

function debounce(key, fn, ms=500) {
  clearTimeout(debounceTimer[key]);
  debounceTimer[key] = setTimeout(fn, ms);
}

async function api(url, opts={}) {
  try {
    const r = await fetch(API + url, {
      headers: {'Content-Type': 'application/json'},
      ...opts
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({detail: r.statusText}));
      throw new Error(e.detail || 'Error');
    }
    return r.json();
  } catch(e) {
    toast(e.message, 'err');
    throw e;
  }
}

function toast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast toast-' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Load status
async function loadStatus() {
  try {
    const s = await api('/api/status');
    document.getElementById('statCloned').textContent = s.cloned;
    document.getElementById('statFailed').textContent = s.failed;
    document.getElementById('statUptime').textContent = s.uptime_hours + 'h ' + s.uptime_mins + 'm';
    document.getElementById('statRoutes').textContent = s.active_routes;
    const badge = document.getElementById('statusBadge');
    badge.textContent = s.is_paused ? 'PAUSED' : 'RUNNING';
    badge.className = 'badge ' + (s.is_paused ? 'badge-off' : 'badge-on');
  } catch(e) {}
}

// Load config
async function loadConfig() {
  try {
    const c = await api('/api/config');
    document.getElementById('togglePause').checked = c.is_paused;
    document.getElementById('toggleLinks').checked = c.remove_links;
    document.getElementById('toggleMentions').checked = c.remove_usernames;
    document.getElementById('toggleTags').checked = c.remove_hashtags;
    document.getElementById('toggleFwd').checked = c.skip_forwarded;
    document.getElementById('headerText').value = c.header_text || '';
    document.getElementById('footerText').value = c.footer_text || '';
    document.getElementById('cloneDelay').value = c.clone_delay || '1';
  } catch(e) {}
}

// Set config
function setConfig(key, value) {
  debounce('config', async () => {
    const c = {};
    c[key] = value;
    await api('/api/config', {method:'POST', body:JSON.stringify(c)});
    toast('Updated');
    loadStatus();
  }, 300);
}

// Load routes
async function loadRoutes() {
  try {
    const r = await api('/api/routes');
    const list = document.getElementById('routesList');
    if (!r.routes.length) {
      list.innerHTML = '<div class="empty">No routes yet. Add one above.</div>';
      return;
    }
    list.innerHTML = r.routes.map(rt => `
      <div class="route-item">
        <div class="route-info">
          <div class="route-channels">
            ${esc(rt.source_name||rt.source_id)} <span style="color:var(--accent);margin:0 6px">&#8594;</span> ${esc(rt.dest_name||rt.dest_id)}
          </div>
          <div class="route-ids">${rt.source_id} &#8594; ${rt.dest_id}</div>
        </div>
        <span class="route-active ${rt.is_active?'active-on':'active-off'}">${rt.is_active?'ACTIVE':'DISABLED'}</span>
        <div class="route-actions">
          <button class="btn btn-ghost btn-sm" onclick="toggleRoute(${rt.source_id},${rt.dest_id})">Toggle</button>
          <button class="btn btn-danger btn-sm" onclick="deleteRoute(${rt.source_id},${rt.dest_id})">Delete</button>
        </div>
      </div>
    `).join('');
  } catch(e) {}
}

function esc(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

async function addRoute() {
  const src = document.getElementById('routeSource').value.trim();
  const dst = document.getElementById('routeDest').value.trim();
  if (!src || !dst) return toast('Fill both fields', 'err');
  try {
    await api('/api/routes', {method:'POST', body:JSON.stringify({source:src,dest:dst})});
    toast('Route added!');
    document.getElementById('routeSource').value = '';
    document.getElementById('routeDest').value = '';
    loadRoutes();
    loadStatus();
  } catch(e) {}
}

async function deleteRoute(s, d) {
  if (!confirm('Delete this route?')) return;
  await api('/api/routes', {method:'DELETE', body:JSON.stringify({source_id:s,dest_id:d})});
  toast('Route deleted');
  loadRoutes();
  loadStatus();
}

async function toggleRoute(s, d) {
  await api('/api/routes/toggle', {method:'POST', body:JSON.stringify({source_id:s,dest_id:d})});
  toast('Route toggled');
  loadRoutes();
  loadStatus();
}

// Init
loadStatus();
loadConfig();
loadRoutes();
setInterval(loadStatus, 5000);
setInterval(loadRoutes, 10000);
</script>
</body>
</html>
